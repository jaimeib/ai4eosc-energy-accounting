# Copy to config.yaml and fill in the secrets, or leave them out here and
# set them via environment variables instead (MIMIR_USER, MIMIR_PASSWORD,
# CIM_EMAIL, CIM_PASSWORD). config.yaml is gitignored; this example file
# is not, so never put real credentials in this file.
#
# chmod 600 config.yaml once it contains real credentials.

mimir:
  endpoint: "https://mimir.k8s.cloud.ai4eosc.eu/prometheus"
  user: "mimir-user"
  password: "mimir-password"
  query: "sum by(container_label_com_hashicorp_nomad_alloc_id, datacenter) (scaph_process_power_consumption_microwatts)"
  alloc_id_label: "container_label_com_hashicorp_nomad_alloc_id"
  datacenter_label: "datacenter"
  # Optional: fold GPU power into the same per-allocation Wh total as CPU,
  # before the CPU normalization factor below is applied. Requires DCGM
  # (DCGM_FI_DEV_POWER_USAGE, in Watts) and a Nomad GPU allocation mapper
  # exporter (nomad_gpu_allocation_info, mapping a GPU UUID to alloc_id) to
  # both be scraped -- not every deployment has these, so this is opt-in
  # (empty query below disables it). Only GPUs with a direct UUID mapping
  # are matched; nomad_gpu_allocation_info rows with UUID="all" (the whole
  # node reported at once, no per-GPU allocation) are intentionally not
  # matched -- not expected to occur since GPUs are allocated exclusively
  # per container.
  # gpu_query: >
  #   sum by(alloc_id, datacenter) (
  #     DCGM_FI_DEV_POWER_USAGE
  #     * on(UUID, instance) group_left(alloc_id)
  #     nomad_gpu_allocation_info
  #   )
  # gpu_alloc_id_label: "alloc_id"
  step_seconds: 30
  verify_ssl: true

cim:
  base_url: "https://greendigit-cim.sztaki.hu"
  email: "you@example.org"
  password: "cim-password"
  verify_ssl: true

accounting:
  site_name: "IFCA-LCG2"         # SiteName reported to CIM - fixed for now
  cloud_type: "container (PaaS)" # CloudType - marks these as PaaS execution units
  # iMagine is a deployment of the AI4EOSC platform, not a separate one,
  # so CloudComputeService is fixed - the `datacenter` label only
  # distinguishes the deployment via Owner below.
  compute_service: "AI4EOSC"
  cpu_normalization_factor: 2.03 # cASO's CPU-benchmark normalization factor, fixed
  # Maps the `datacenter` Prometheus label to the Owner reported to CIM
  # (the deployment's domain name).
  owner_map:
    ifca-ai4eosc: "ai4eosc.eu"
    ifca-imagine: "imagine-ai.eu"

# pointer.file, pointer.open_allocations_file, sender.file_path and
# log_file all default to living under <project directory>/var/ (created
# automatically) regardless of the current working directory the script
# is run from - nothing outside the project needs to exist for this to
# work. Uncomment below to override.

pointer:
  # file: "/absolute/or/relative/path/to/lastrun"
  # open_allocations_file: "/absolute/or/relative/path/to/open_allocations.json"
  initial_lookback_hours: 6   # window covered on the very first run
  # Recommended for production: set this to the cron interval in seconds
  # (e.g. 21600 for "every 6h") so every StartExecTime/EndExecTime lands
  # on a clean UTC boundary (00:00/06:00/12:00/18:00 for 21600) instead of
  # the exact moment the process happened to start. 0 (default) disables
  # alignment, and query_lag_seconds is then subtracted from "now" as a
  # fixed offset instead (see below).
  align_seconds: 21600
  # With align_seconds set, this is no longer a fixed offset: it's the
  # minimum time a boundary must already be in the past before this run
  # trusts Mimir to have scraped it. Schedule the cron with at least this
  # much delay after each align_seconds boundary (see
  # ai4eosc-energy-accounting.cron for a ready-to-edit "5 min past the
  # mark" example) -- this check is then just a safety net, not something
  # that shifts the reported timestamps. With align_seconds: 0, it's the
  # old fixed "now minus this many seconds" margin instead.
  query_lag_seconds: 60

sender:
  type: "cim"    # "cim" to push to GreenDIGIT CIM, or "file" to write to file_path instead (testing)
  # file_path: "/absolute/or/relative/path/to/records.jsonl"

data_quality:
  # Per-series correction of out-of-magnitude power samples before they are
  # summed into Wh. A single bad measurement (a series that normally sits at a
  # few watts suddenly reporting several kW, or a NaN/Inf) is detected and
  # overwritten with a value inferred from the nearest trustworthy samples:
  # linear interpolation of the two adjacent good samples for a point in the
  # middle, or the linear trend of the two nearest good samples for a point at
  # the start/end of the series. Only high spikes are corrected; a sample
  # dropping toward zero is left alone (legitimate idle period).
  enabled: true
  # A sample is a bad measurement when it is more than this many times the
  # local level (median of the window samples) on BOTH sides (10 = one order
  # of magnitude). Requiring both sides means a real sustained ramp
  # (microwatts to milliwatts to watts) is left alone, only a lone spike the
  # series drops back down from is corrected.
  outlier_factor: 10.0
  # Number of samples on each side whose median defines the "local level".
  # Larger = more context, but slower to react to genuine level changes.
  window: 5
  # Series with fewer samples than this are left untouched (too little context
  # to tell a spike from a genuine level change).
  min_samples: 5

dry_run: false
log_level: "INFO"
# log_file: null   # set to null to log to stdout only instead of var/ai4eosc-energy-accounting.log
